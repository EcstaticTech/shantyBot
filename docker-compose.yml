version: '3.8'

services:
  shantybot:
    build: .
    container_name: shantybot
    restart: unless-stopped
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./media/shanties:/app/media/shanties:ro
      - ./media/ambient:/app/media/ambient:ro
      - ./media/cache:/app/media/cache:rw
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
